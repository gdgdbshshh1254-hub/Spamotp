<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spam OTP</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex items-center justify-center">
    <div class="max-w-md w-full p-6 bg-gray-800 rounded-xl shadow-2xl">
        <h1 class="text-2xl font-bold text-center mb-6 text-green-400">Spam OTP</h1>
        
        <input type="text" id="nomor" placeholder="08xxxxxxxxxx" 
               class="w-full p-3 mb-4 rounded bg-gray-700 border border-gray-600 focus:outline-none focus:border-green-500">
        
        <select id="jumlah" class="w-full p-3 mb-4 rounded bg-gray-700 border border-gray-600">
            <option value="5">5x</option>
            <option value="10">10x</option>
            <option value="20">20x</option>
            <option value="50">50x</option>
        </select>
        
        <button onclick="mulaiSpam()" id="btn" 
                class="w-full py-3 bg-green-600 hover:bg-green-700 rounded font-bold transition">
            Mulai Spam
        </button>
        
        <div id="progress" class="mt-4 hidden">
            <div class="w-full bg-gray-700 rounded-full h-2.5">
                <div id="bar" class="bg-green-500 h-2.5 rounded-full" style="width: 0%"></div>
            </div>
            <p id="status" class="text-sm mt-2 text-center"></p>
        </div>
        
        <div id="log" class="mt-4 max-h-40 overflow-y-auto text-xs font-mono bg-black p-3 rounded hidden"></div>
    </div>

    <script src="script.js"></script>
</body>
          </html>
